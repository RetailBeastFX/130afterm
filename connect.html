        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --amber: #ffb000;
            --amber-glow: rgba(255, 176, 0, 0.15);
            --bg-dark: #050505;
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        body {
            background-color: var(--bg-dark);
            color: #f0ede8;
            font-family: 'Inter', sans-serif;
            cursor: crosshair;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 176, 0, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02), transparent 25%);
        }

        /* ── SHARED STICKY NAV ── */
        .site-nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5,5,5,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        /* ── SCANLINES ── */
        .scanlines { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05)); background-size: 100% 4px; z-index: 9999; pointer-events: none; opacity: 0.3; }

        /* ── PARTICLES ── */
        .particles-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .particle { position: absolute; width: 2px; height: 2px; background: var(--amber); box-shadow: 0 0 10px var(--amber); border-radius: 50%; animation: float-up linear infinite; opacity: 0; }
        @keyframes float-up { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        /* ── GLASS PANELS ── */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .glass-panel:hover { border-color: rgba(255,176,0,0.2); transform: translateY(-1px); }
        .glass-panel:hover::before { opacity: 1; }

        /* ── SOCIAL BUTTONS ── */
        .link-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 18px 24px; border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            color: #f0ede8; font-size: 14px; font-weight: 600;
            transition: all 0.3s ease; text-decoration: none;
            position: relative; overflow: hidden;
        }
        .link-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,176,0,0.1), transparent);
            transform: translateX(-100%); transition: transform 0.5s ease; z-index: 0;
        }
        .link-btn:hover::before { transform: translateX(100%); }
        .link-btn:hover {
            background: rgba(255,176,0,0.05); color: #fff;
            border-color: rgba(255,176,0,0.3); transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(255,176,0,0.1);
        }
        .link-btn > * { position: relative; z-index: 1; }
        
        .link-btn.primary { background: rgba(255,176,0,0.08); border-color: rgba(255,176,0,0.2); }

        /* ── GLITCH EFFECT ── */
        .glitch-hover { position: relative; }
        .glitch-hover:hover { text-shadow: 1px 0 #ff003c, -1px 0 #00f0ff; animation: glitch-jiggle 0.2s infinite linear alternate-reverse; }
        @keyframes glitch-jiggle { 0% { transform: skew(0deg); } 20% { transform: skew(-1.5deg); } 40% { transform: skew(1.5deg); } 100% { transform: skew(0deg); } }

        /* ── UTILS ── */
        .amber-text { color: var(--amber); }
        .dot-blink { animation: blink 1.5s infinite ease-in-out; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
