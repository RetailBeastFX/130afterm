[build]
  command = "npm run build"
  publish = "dist"

# .html → clean path (prevents redirect loops from old links)
[[redirects]]
  from = "/now.html"
  to = "/now"
  status = 301

[[redirects]]
  from = "/archive.html"
  to = "/archive"
  status = 301

[[redirects]]
  from = "/terminal.html"
  to = "/terminal"
  status = 301

[[redirects]]
  from = "/workspace.html"
  to = "/workspace"
  status = 301

[[redirects]]
  from = "/connect.html"
  to = "/links"
  status = 301

# /connect was folded into /links in the 2026-10 redesign
[[redirects]]
  from = "/connect"
  to = "/links"
  status = 301

[[redirects]]
  from = "/connect/"
  to = "/links"
  status = 301

# /workspace was removed in the 2026-10 redesign — send it home
[[redirects]]
  from = "/workspace"
  to = "/"
  status = 301

[[redirects]]
  from = "/workspace/"
  to = "/"
  status = 301

[[redirects]]
  from = "/now"
  to = "/now/index.html"
  status = 200

[[redirects]]
  from = "/archive"
  to = "/archive/index.html"
  status = 200

# Trailing-slash variants (prevents redirect loops)
[[redirects]]
  from = "/terminal"
  to = "/terminal/index.html"
  status = 200

[[redirects]]
  from = "/links"
  to = "/links/index.html"
  status = 200

[[redirects]]
  from = "/links/"
  to = "/links/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
