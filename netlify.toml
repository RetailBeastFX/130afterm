[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/now"
  to = "/now/index.html"
  status = 200

[[redirects]]
  from = "/archive"
  to = "/archive/index.html"
  status = 200

[[redirects]]
  from = "/workspace"
  to = "/workspace/index.html"
  status = 200

[[redirects]]
  from = "/terminal"
  to = "/terminal/index.html"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/connect/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
